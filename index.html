<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lav Jain | Enterprise Data Architecture & BI Analytics</title>
  
  <!-- Tailwind CSS & Marked.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .prose h1 { font-size: 2.25rem; font-weight: 800; color: #0f172a; margin-top: 1.5rem; margin-bottom: 1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    .prose h2 { font-size: 1.5rem; font-weight: 700; color: #0369a1; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.35rem; }
    .prose h3 { font-size: 1.25rem; font-weight: 600; color: #1e293b; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    .prose p { color: #334155; font-size: 1rem; line-height: 1.75; margin-bottom: 1.25rem; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; color: #334155; margin-bottom: 1.25rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.5rem; color: #334155; margin-bottom: 1.25rem; }
    .prose li { margin-bottom: 0.5rem; }
    .prose strong { color: #0f172a; font-weight: 700; }
    .prose blockquote { border-left: 4px solid #0284c7; padding-left: 1rem; color: #475569; font-style: italic; background-color: #f8fafc; padding: 0.75rem 1rem; margin-bottom: 1.25rem; border-radius: 0.375rem; }
    .prose table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 1.5rem; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .prose th { background-color: #0f172a; color: #ffffff; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; }
    .prose td { padding: 0.75rem 1rem; border: 1px solid #e2e8f0; color: #334155; background-color: #ffffff; }
    .prose tr:nth-child(even) td { background-color: #f8fafc; }
    .prose a { color: #0284c7; text-decoration: underline; font-weight: 600; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Simple Header Bar -->
  <header class="bg-slate-900 text-white py-6 px-6 border-b border-slate-800">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Lav Jain</h1>
        <p class="text-xs text-brand-400 font-semibold mt-1">Enterprise Data Architect & Analytics Lead</p>
      </div>
      <div class="flex gap-4 text-sm font-semibold">
        <a href="https://www.linkedin.com/in/jainlav/" target="_blank" class="hover:text-sky-400 transition"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
        <a href="mailto:lavj85@gmail.com" class="hover:text-sky-400 transition"><i class="fa-solid fa-envelope"></i> Contact</a>
      </div>
    </div>
  </header>

  <!-- Main Markdown Content Container -->
  <main class="max-w-4xl mx-auto px-6 py-10 w-full flex-grow">
    <div id="content" class="bg-white p-8 sm:p-12 rounded-2xl border border-slate-200 shadow-sm prose">
      <div class="flex items-center justify-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl me-3"></i> Loading Portfolio Content...
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="bg-slate-900 text-slate-400 text-xs py-6 text-center border-t border-slate-800">
    <div class="max-w-4xl mx-auto px-6">
      © 2026 Lav Jain. Portfolio & Experience Summary.
    </div>
  </footer>

  <script>
    async function loadPortfolioMD() {
      const contentDiv = document.getElementById('content');
      
      // Paths to check for your index.md or portfolio.md file
      const possiblePaths = [
        'portfolio/index.md',
        'portfolio/README.md',
        'INDEX.md',
        'README.md'
      ];

      let rawText = null;

      for (const path of possiblePaths) {
        try {
          const res = await fetch(path, { cache: 'no-cache' });
          if (res.ok) {
            rawText = await res.text();
            break;
          }
        } catch (e) {}
      }

      if (rawText) {
        // Strip YAML front-matter metadata if present
        if (rawText.startsWith('---')) {
          const secondDashIndex = rawText.indexOf('---', 3);
          if (secondDashIndex !== -1) {
            rawText = rawText.substring(secondDashIndex + 3).trim();
          }
        }

        contentDiv.innerHTML = marked.parse(rawText);
      } else {
        contentDiv.innerHTML = `
          <h2>Lav Jain</h2>
          <p><strong>Enterprise Data Architecture & BI Analytics Solutions Expert</strong></p>
          <p>15+ years of experience delivering scalable enterprise analytics platforms across Manufacturing, Retail, Banking, Aviation, and Telecom sectors.</p>
          <h3>Core Competencies & Ecosystems</h3>
          <ul>
            <li><strong>Microsoft Fabric:</strong> Certified Data Engineer Associate (DP-700)</li>
            <li><strong>Azure Databricks:</strong> Certified Data Engineer (DP-750)</li>
            <li><strong>Analytics & BI:</strong> Qlik Sense SaaS, Power BI (DP-600), Inphinity Forms</li>
            <li><strong>Architecture & Strategy:</strong> Platform Scaling, Enterprise Data Governance, Multi-tenant Data Security</li>
          </ul>
          <h3>Contact & Profiles</h3>
          <p>Connect via <a href="https://www.linkedin.com/in/lavjain15/">LinkedIn</a> or reach out directly for executive data leadership opportunities.</p>
        `;
      }
    }

    loadPortfolioMD();
  </script>

</body>
</html>
